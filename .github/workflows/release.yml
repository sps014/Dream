name: Release toolchain

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0); leave empty to use github.ref_name"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: linux-arm64
            archive: tar.gz
          - os: macos-13
            target: macos-x64
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: windows-x64
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        shell: bash
        run: cargo build --release -p dream -p dreamer -p dream-lsp

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          STAGE="dist/dream-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          EXT=""
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            EXT=".exe"
          fi
          cp "target/release/dream${EXT}" "$STAGE/"
          cp "target/release/dreamer${EXT}" "$STAGE/"
          cp "target/release/dream-lsp${EXT}" "$STAGE/"
          mkdir -p dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            # Windows runners have no `zip`; use PowerShell Compress-Archive.
            if command -v powershell.exe >/dev/null 2>&1; then
              powershell.exe -NoProfile -Command \
                "Compress-Archive -Path 'dist/dream-${VERSION}-${{ matrix.target }}' -DestinationPath 'dist/dream-${VERSION}-${{ matrix.target }}.zip' -Force"
            elif command -v pwsh >/dev/null 2>&1; then
              pwsh -NoProfile -Command \
                "Compress-Archive -Path 'dist/dream-${VERSION}-${{ matrix.target }}' -DestinationPath 'dist/dream-${VERSION}-${{ matrix.target }}.zip' -Force"
            else
              # Git for Windows / modern Windows ships bsdtar which can write .zip
              tar -C dist -a -cf "dist/dream-${VERSION}-${{ matrix.target }}.zip" "dream-${VERSION}-${{ matrix.target }}"
            fi
          else
            tar -C dist -czf "dist/dream-${VERSION}-${{ matrix.target }}.tar.gz" "dream-${VERSION}-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dream-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Dream ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
