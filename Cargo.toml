[package]
name = "dream"
version = "0.1.0"
authors = ["Shivendra Pratap Singh <shivendrapsingh014@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Front-end crates
dream-text = { path = "crates/dream-text" }
dream-diagnostics = { path = "crates/dream-diagnostics" }
dream-syntax = { path = "crates/dream-syntax" }
# IR-boundary middle/back-end crates
dream-types = { path = "crates/dream-types" }
dream-hir = { path = "crates/dream-hir" }
dream-abi = { path = "crates/dream-abi" }
dream-stdlib = { path = "crates/dream-stdlib" }
dream-sema = { path = "crates/dream-sema" }
dream-mir = { path = "crates/dream-mir" }
bumpalo = "3.20.3"
# Insertion-ordered map used for the codegen tables whose iteration order reaches emitted
# `.wat` output, so compilation is reproducible (std `HashMap` randomizes iteration per run).
indexmap = "2"
logos = "0.16.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasmtime = { version = "45.0.2", optional = true }
wat = "1.252.0"
# HTTP client backing the native (wasmtime) `HttpClient` host functions (src/execution/host.rs).
# Blocking so it fits the synchronous host-call model; `serde_json` parses the header object.
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
serde_json = { version = "1", optional = true }
# Cross-platform raw-mode terminal input backing `System.readKey` (src/execution/host/console.rs)
# and Windows ANSI virtual-terminal setup for `System.setForeground`/`setBackground`.
crossterm = { version = "0.28", optional = true }
# Resolves the local system timezone's UTC offset (including DST) for an arbitrary instant,
# backing `DateTime.now()`/`DateTime.to_local()` (src/execution/host/datetime.rs). Calendar math
# itself is implemented in pure Dream; chrono is only used for OS timezone-database lookups.
chrono = { version = "0.4", optional = true }
unicode-normalization = { version = "0.1", optional = true }
unicode-segmentation = { version = "1.12", optional = true }
# Host-backed digests and CSPRNG for `system.crypto` (src/execution/host/crypto.rs).
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
getrandom = { version = "0.2", optional = true }
# Rust bindings to Binaryen's `wasm-opt`, backing the CLI's opt-in `-O`/`--optimize` post-processing
# pass (src/driver/wasm_opt.rs) that shrinks/optimizes the emitted `.wasm` beyond what the MIR pass
# pipeline + structural WAT DCE already do. Builds Binaryen from C++ source, so it is excluded from
# the wasm32 analyzer build (see the `wasm-opt` feature below) like the other native-only deps.
wasm-opt = { version = "0.116", optional = true }

[features]
default = ["native", "wasm-opt"]
# `native` pulls in the wasmtime-backed WASM runtime used by the `dream` CLI to
# execute compiled programs. It is excluded from the wasm32 analyzer build, whose
# only need is the lexer/parser/analyzer front-end.
native = ["wasmtime", "reqwest", "serde_json", "crossterm", "chrono", "sha2", "hmac", "getrandom", "unicode-normalization", "unicode-segmentation"]
# `wasm-opt` pulls in Binaryen bindings for the CLI's `-O`/`--optimize` flag. Separate from `native`
# since it's a build-time optimization concern rather than a runtime-execution one, but excluded
# from the wasm32 analyzer build the same way.
wasm-opt = ["dep:wasm-opt"]

[dev-dependencies]
pretty_assertions = "1.4.1"
rayon = "1"

[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true

[workspace]
members = [
    ".",
    "crates/dream-text",
    "crates/dream-diagnostics",
    "crates/dream-syntax",
    "crates/dream-types",
    "crates/dream-hir",
    "crates/dream-abi",
    "crates/dream-stdlib",
    "crates/dream-sema",
    "crates/dream-mir",
    "tooling/dream-lsp",
    "tooling/dreamer",
]
# v2 resolver so the wasm32 analyzer build does not inherit the root crate's default
# `native` feature (and therefore never tries to compile wasmtime for wasm).
resolver = "2"
