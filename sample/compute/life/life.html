<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dream Game of Life</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05080a; }
      canvas#life {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        background: #05080a;
      }
      #hud {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        z-index: 2;
        color: #d8f5e4;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-size: 0.85rem;
        opacity: 0.8;
        pointer-events: none;
        text-shadow: 0 1px 4px #000;
      }
      #hud.err { color: #ff8a8a; opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="life" width="128" height="128"></canvas>
    <div id="hud">loading…</div>
    <script type="module">
      import { run } from "../../../runtime/dream.js";

      const hud = document.getElementById("hud");
      const setHud = (msg, err = false) => {
        hud.textContent = msg;
        hud.classList.toggle("err", err);
      };

      window.addEventListener("unhandledrejection", (e) => {
        setHud(String(e.reason || e), true);
      });

      try {
        await run("./life.wasm");
        setHud("Conway's Game of Life · @compute step + paint");
      } catch (e) {
        console.error(e);
        setHud(String(e && e.message ? e.message : e), true);
      }
    </script>
  </body>
</html>
