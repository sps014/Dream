<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dream Music Player</title>
    <style>
      :root {
        --bg: #0b0b12;
        --card: rgba(24, 24, 34, 0.72);
        --card-border: rgba(255, 255, 255, 0.08);
        --accent: #7c5cff;
        --accent-2: #ff6bd6;
        --accent-soft: #7c5cff33;
        --text: #f3f1fb;
        --muted: #9793ad;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(circle at 15% 10%, #3a2a6b55 0%, transparent 45%),
          radial-gradient(circle at 85% 90%, #ff6bd633 0%, transparent 45%),
          var(--bg);
        color: var(--text);
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        overflow: hidden;
      }

      .player {
        width: 100%;
        max-width: 460px;
        max-height: 100%;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 22px;
        padding: 1.2rem 1.35rem;
        box-shadow: 0 30px 70px -25px rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
      }

      .header-row {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 0.9rem;
      }

      .art {
        width: 3.3rem;
        height: 3.3rem;
        flex-shrink: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        box-shadow: 0 12px 26px -12px var(--accent-soft);
      }

      .now-playing {
        min-width: 0;
        flex: 1;
      }

      .eyebrow {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.15rem;
      }

      #track-title {
        display: block;
        font-size: 1.05rem;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #track-artist {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 0.1rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .seek-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.65rem;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 5px;
        border-radius: 3px;
        background: #2f2f40;
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: none;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
      }

      #time-display {
        font-size: 0.7rem;
        color: var(--muted);
        min-width: 4.5rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .transport {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 0.75rem;
      }

      .transport button {
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 1.25rem;
        cursor: pointer;
        padding: 0.4rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease, transform 0.1s ease;
      }

      .transport button:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .transport button:active {
        transform: scale(0.92);
      }

      #play-button {
        width: 3.1rem;
        height: 3.1rem;
        font-size: 1.3rem;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        box-shadow: 0 10px 26px -8px var(--accent-soft);
      }

      #play-button:hover {
        filter: brightness(1.12);
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      }

      .volume-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.75rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .volume-row input[type="range"] {
        max-width: 140px;
      }

      .playlist-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 0.65rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.4rem;
        flex-shrink: 0;
      }

      .playlist-heading span.count {
        text-transform: none;
        letter-spacing: normal;
        font-size: 0.72rem;
      }

      #playlist {
        list-style: none;
        margin: 0;
        padding: 0;
        flex: 1;
        min-height: 60px;
        max-height: 230px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      #playlist::-webkit-scrollbar {
        width: 6px;
      }

      #playlist::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
      }

      #playlist .track {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.45rem 0.6rem;
        border-radius: 10px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      #playlist .track:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      #playlist .track.active {
        background: var(--accent-soft);
        border-color: rgba(124, 92, 255, 0.4);
      }

      .track-info {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
      }

      .track-title-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        min-width: 0;
      }

      #playlist .track-title {
        font-size: 0.85rem;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #playlist .track-artist {
        font-size: 0.72rem;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ncs-badge {
        flex-shrink: 0;
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #0b0b12;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        padding: 0.08rem 0.4rem;
        border-radius: 999px;
      }

      .footnote {
        text-align: center;
        font-size: 0.63rem;
        color: var(--muted);
        margin-top: 0.6rem;
        flex-shrink: 0;
      }

      .footnote code {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="player">
      <div class="header-row">
        <div class="art">&#127925;</div>
        <div class="now-playing">
          <p class="eyebrow">Dream &middot; compiled to WebAssembly</p>
          <span id="track-title">Loading&hellip;</span>
          <span id="track-artist"></span>
        </div>
      </div>

      <div class="seek-row">
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" />
        <span id="time-display">0:00 / 0:00</span>
      </div>

      <div class="transport">
        <button id="prev-button" aria-label="Previous">&#9198;</button>
        <button id="play-button" aria-label="Play">&#9654;</button>
        <button id="next-button" aria-label="Next">&#9197;</button>
      </div>

      <div class="volume-row">
        <span>&#128266;</span>
        <input id="volume" type="range" min="0" max="100" value="80" />
      </div>

      <p class="playlist-heading">
        <span>Playlist</span>
        <span class="count">NCS &middot; SoundHelix</span>
      </p>
      <ul id="playlist"></ul>

      <!-- Dream drives this element entirely via the dynamic `js` type: no inline JS here. -->
      <audio id="audio-player" preload="metadata"></audio>

      <p class="footnote">
        Logic lives in <code>music_player.dream</code>, compiled to WebAssembly.
      </p>
    </main>

    <script type="module">
      import { run } from "../../runtime/dream.js";
      await run("music_player.wasm");
    </script>
  </body>
</html>
