<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dream Music Player</title>
    <style>
      :root {
        --bg: #0e0e14;
        --card: #17171f;
        --card-border: #2a2a36;
        --accent: #7c5cff;
        --accent-soft: #7c5cff33;
        --text: #eceaf6;
        --muted: #8d8aa3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #1c1c2b 0%, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .player {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 1.75rem;
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
      }

      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 1.1rem;
        text-align: center;
      }

      .art {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 16px;
        background: linear-gradient(135deg, #7c5cff 0%, #ff6bd6 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        margin-bottom: 1.25rem;
        box-shadow: 0 20px 40px -18px var(--accent-soft);
      }

      .now-playing {
        text-align: center;
        margin-bottom: 1.25rem;
      }

      #track-title {
        display: block;
        font-size: 1.15rem;
        font-weight: 700;
      }

      #track-artist {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 0.2rem;
      }

      .seek-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1.1rem;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 5px;
        border-radius: 3px;
        background: #2a2a36;
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }

      #time-display {
        font-size: 0.72rem;
        color: var(--muted);
        min-width: 4.5rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .transport {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        margin-bottom: 1.4rem;
      }

      .transport button {
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 1.3rem;
        cursor: pointer;
        padding: 0.4rem;
        border-radius: 50%;
        transition: background 0.15s ease, transform 0.1s ease;
      }

      .transport button:hover {
        background: #24243266;
      }

      .transport button:active {
        transform: scale(0.92);
      }

      #play-button {
        width: 3.2rem;
        height: 3.2rem;
        font-size: 1.4rem;
        background: var(--accent);
        box-shadow: 0 10px 24px -8px var(--accent-soft);
      }

      #play-button:hover {
        background: #8c6dff;
      }

      .volume-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1.4rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .volume-row input[type="range"] {
        max-width: 140px;
      }

      .playlist-heading {
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.6rem;
      }

      #playlist {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 220px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      #playlist .track {
        display: flex;
        flex-direction: column;
        padding: 0.55rem 0.7rem;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      #playlist .track:hover {
        background: #22222f;
      }

      #playlist .track.active {
        background: var(--accent-soft);
      }

      #playlist .track-title {
        font-size: 0.88rem;
        font-weight: 600;
      }

      #playlist .track-artist {
        font-size: 0.74rem;
        color: var(--muted);
      }

      .footnote {
        text-align: center;
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 1.4rem;
      }

      .footnote code {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="player">
      <p class="eyebrow">Dream &middot; compiled to WebAssembly</p>

      <div class="art">&#127925;</div>

      <div class="now-playing">
        <span id="track-title">Loading&hellip;</span>
        <span id="track-artist"></span>
      </div>

      <div class="seek-row">
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" />
        <span id="time-display">0:00 / 0:00</span>
      </div>

      <div class="transport">
        <button id="prev-button" aria-label="Previous">&#9198;</button>
        <button id="play-button" aria-label="Play">&#9654;</button>
        <button id="next-button" aria-label="Next">&#9197;</button>
      </div>

      <div class="volume-row">
        <span>&#128266;</span>
        <input id="volume" type="range" min="0" max="100" value="80" />
      </div>

      <p class="playlist-heading">Playlist</p>
      <ul id="playlist"></ul>

      <!-- Dream drives this element entirely via the dynamic `js` type: no inline JS here. -->
      <audio id="audio-player" preload="metadata"></audio>

      <p class="footnote">
        All playback logic lives in <code>music_player.dream</code> &mdash; this page only loads
        the shared <code>runtime/dream.js</code> WASM bootstrap.
      </p>
    </main>

    <script type="module">
      import { run } from "../../runtime/dream.js";
      await run("music_player.wasm");
    </script>
  </body>
</html>
